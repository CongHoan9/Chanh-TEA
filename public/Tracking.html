<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="TEXT/css" href="Cart.css">
        <style>
            .tracking-status {
                background: #f5f5f5;
                padding: 15px;
                border-radius: 8px;
                margin-bottom: 15px;
            }

            .status-header {
                display: flex;
                justify-content: space-between;
                margin-bottom: 10px;
            }

            .status-header h4 {
                margin: 0;
                color: #16a34a;
            }

            .status-timeline {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .timeline-item {
                display: flex;
                gap: 10px;
                align-items: flex-start;
            }

            .timeline-dot {
                min-width: 12px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #ccc;
                margin-top: 4px;
            }

            .timeline-dot.active {
                background: #16a34a;
            }

            .timeline-dot.complete {
                background: #16a34a;
            }

            .timeline-content {
                flex: 1;
            }

            .timeline-content p {
                margin: 0;
                font-size: 14px;
            }

            .timeline-content .status-label {
                font-weight: 600;
                color: #333;
            }

            .timeline-content .status-time {
                font-size: 12px;
                color: #999;
            }

            .empty-tracking {
                text-align: center;
                padding: 40px 20px;
                color: #999;
            }
        </style>
    </head>
    <body>
        <div class="Container">
            <div class="page-header">
                <h1>Theo dõi đơn hàng</h1>
            </div>
            
            <div id="trackingList"></div>
            <div id="emptyTracking" class="empty-tracking">
                <p>Bạn không có đơn hàng nào đang được giao</p>
            </div>
        </div>

        <script>
            function renderTrackingList() {
                const allOrders = JSON.parse(localStorage.getItem("chanhTeaCreatedOrders") || "[]");
                
                // Filter orders that are in transit (status includes 'pending', 'assigned', 'preparing', 'delivering')
                const activeOrders = allOrders.filter(order => {
                    const status = (order.status || "pending").toLowerCase();
                    return ["pending", "assigned", "preparing", "delivering"].includes(status);
                });

                const $trackingList = $("#trackingList").empty();
                const $emptyTracking = $("#emptyTracking");

                if (activeOrders.length === 0) {
                    $emptyTracking.show();
                    return;
                }

                $emptyTracking.hide();

                activeOrders.forEach(order => {
                    const statusBadge = getStatusBadge(order.status);
                    const timeline = getStatusTimeline(order.status);

                    const trackingHTML = `
                        <div class="tracking-status">
                            <div class="status-header">
                                <div>
                                    <h4>Mã đơn: ${order.code || "N/A"}</h4>
                                    <p style="margin: 5px 0 0 0; font-size: 14px; color: #666;">
                                        Ngày đặt: ${order.created_at ? new Date(order.created_at).toLocaleDateString('vi-VN') : "N/A"}
                                    </p>
                                </div>
                                <span class="status-badge" style="${getStatusStyle(order.status)}">${statusBadge}</span>
                            </div>
                            <div class="status-timeline">
                                ${timeline}
                            </div>
                            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
                                <p><strong>Cửa hàng:</strong> ${order.assigned_store?.name || "N/A"}</p>
                                <p><strong>Địa chỉ giao:</strong> ${order.customer_address || "N/A"}</p>
                                <p><strong>Tổng tiền:</strong> ${order.total ? order.total.toLocaleString('vi-VN') + ' ₫' : "N/A"}</p>
                            </div>
                        </div>
                    `;

                    $trackingList.append(trackingHTML);
                });
            }

            function getStatusBadge(status) {
                const statusMap = {
                    "pending": "Chờ xác nhận",
                    "assigned": "Đã gán cửa hàng",
                    "preparing": "Đang chuẩn bị",
                    "delivering": "Đang giao",
                    "completed": "Đã giao",
                    "cancelled": "Đã hủy"
                };
                return statusMap[status?.toLowerCase()] || "Chưa xác định";
            }

            function getStatusStyle(status) {
                const statusMap = {
                    "pending": "background: #fff3cd; color: #856404; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;",
                    "assigned": "background: #e7e8ea; color: #383d41; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;",
                    "preparing": "background: #cfe2ff; color: #084298; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;",
                    "delivering": "background: #d1ecf1; color: #0c5460; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;",
                    "completed": "background: #d4edda; color: #155724; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;",
                    "cancelled": "background: #f8d7da; color: #721c24; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;"
                };
                return statusMap[status?.toLowerCase()] || "";
            }

            function getStatusTimeline(status) {
                const stages = [
                    { label: "Chờ xác nhận", key: "pending" },
                    { label: "Đã gán cửa hàng", key: "assigned" },
                    { label: "Đang chuẩn bị", key: "preparing" },
                    { label: "Đang giao", key: "delivering" },
                    { label: "Đã giao", key: "completed" }
                ];

                const statusLower = status?.toLowerCase() || "pending";
                const currentIndex = stages.findIndex(s => s.key === statusLower);

                return stages.map((stage, index) => {
                    const isComplete = index < currentIndex;
                    const isActive = index === currentIndex;
                    const dotClass = isComplete ? "timeline-dot complete" : isActive ? "timeline-dot active" : "timeline-dot";

                    return `
                        <div class="timeline-item">
                            <div class="${dotClass}"></div>
                            <div class="timeline-content">
                                <p class="status-label">${stage.label}</p>
                            </div>
                        </div>
                    `;
                }).join("");
            }

            $(document).ready(function () {
                renderTrackingList();
                
                // Listen for storage changes
                window.addEventListener('storage', function() {
                    renderTrackingList();
                    updateTrackingButton();
                });
            });

            function updateTrackingButton() {
                const allOrders = JSON.parse(localStorage.getItem("chanhTeaCreatedOrders") || "[]");
                const activeOrders = allOrders.filter(order => {
                    const status = (order.status || "pending").toLowerCase();
                    return ["pending", "assigned", "preparing", "delivering"].includes(status);
                });

                const $btn = $("#trackingBtn");
                const $count = $("#trackingCount");

                if (activeOrders.length > 0) {
                    $btn.show();
                    $count.text(activeOrders.length).attr("data-active", "true");
                } else {
                    $btn.hide();
                    $count.attr("data-active", "false");
                }
            }
        </script>
    </body>
</html>
